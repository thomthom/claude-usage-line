<svg xmlns="http://www.w3.org/2000/svg" width="760" height="172" viewBox="0 0 760 172" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>The usage-line band above the Claude Code message box: Context 8%, Session 71% resetting in 1h 17m, Weekly 10% resetting in 2d 7h.</title>
  <rect width="760" height="172" rx="12" fill="#141414"/>

  <!-- The band the mod draws -->
  <path d="M30 20 H730 A10 10 0 0 1 740 30 V78 H20 V30 A10 10 0 0 1 30 20 Z" fill="#1b1b1b" stroke="#333333"/>

  <g transform="translate(44 36)">
    <circle cx="13" cy="13" r="11" fill="none" stroke="#808080" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="13" cy="13" r="11" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-dasharray="5.53 69.12" transform="rotate(-90 13 13)"/>
    <text x="36" y="10" font-size="13" font-weight="600" fill="#e8e6e3">Context 8%</text>
    <text x="36" y="27" font-size="12" fill="#8a8884">84k / 1M</text>
  </g>

  <g transform="translate(274 36)">
    <circle cx="13" cy="13" r="11" fill="none" stroke="#808080" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="13" cy="13" r="11" fill="none" stroke="#e0a526" stroke-width="3" stroke-linecap="round" stroke-dasharray="49.07 69.12" transform="rotate(-90 13 13)"/>
    <text x="36" y="10" font-size="13" font-weight="600" fill="#e0a526">Session 71%</text>
    <text x="36" y="27" font-size="12" fill="#8a8884">resets in 1h 17m</text>
  </g>

  <g transform="translate(504 36)">
    <circle cx="13" cy="13" r="11" fill="none" stroke="#808080" stroke-opacity="0.35" stroke-width="3"/>
    <circle cx="13" cy="13" r="11" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6.91 69.12" transform="rotate(-90 13 13)"/>
    <text x="36" y="10" font-size="13" font-weight="600" fill="#e8e6e3">Weekly 10%</text>
    <text x="36" y="27" font-size="12" fill="#8a8884">resets in 2d 7h</text>
  </g>

  <!-- The message box below it -->
  <path d="M20 78 H740 V118 A10 10 0 0 1 730 128 H30 A10 10 0 0 1 20 118 Z" fill="#262626" stroke="#333333"/>
  <text x="40" y="108" font-size="14" fill="#6f6d69">Type / for commands</text>

  <text x="24" y="156" font-size="13" fill="#9a9894">Auto</text>
  <text x="736" y="156" font-size="13" fill="#9a9894" text-anchor="end">Opus 5.5 · Medium</text>
</svg>
